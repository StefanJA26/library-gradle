 */

plugins {
  id 'java'
  id 'application'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

jar {
  manifest {
    attributes 'Main-Class': 'dev.stefanmarkan.ui.Main'
  }
}

application {
  mainClass = 'dev.stefanmarkan.ui.Main'
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation platform('org.junit:junit-bom:6.1.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

tasks.named('build') {
  dependsOn('javadoc')
}

